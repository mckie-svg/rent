<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - RydeMyCar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="image/rydemycar.png" type="image/x-icon">
<link rel="stylesheet" href="style.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .registration-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .reg-card {
    background: #fff;
    width: 100%;
    max-width: 440px;
    padding: 2.5rem;
    position: relative;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.05);
    border: 1px solid var(--warm-gray);
  }
  .reg-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  .reg-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    color: var(--black);
    letter-spacing: 1px;
    margin-bottom: 0.5rem;
  }
  .reg-title span { color: var(--gold); }
  .reg-subtitle {
    font-size: 14px;
    color: var(--text-muted);
  }
  .role-toggle {
    display: flex;
    background: var(--section-bg);
    padding: 5px;
    border-radius: 10px;
    margin-bottom: 2rem;
    border: 1px solid var(--warm-gray);
  }
  .role-toggle input { display: none; }
  .role-toggle label {
    flex: 1;
    text-align: center;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.3s ease;
  }
  .role-toggle input:checked + label {
    background: var(--gold);
    color: var(--black);
    box-shadow: 0 4px 12px rgba(232, 160, 32, 0.2);
  }
  .form-field { margin-bottom: 1.25rem; }
  .form-field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--black);
    margin-bottom: 6px;
  }
  .form-field input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--warm-gray);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s;
    outline: none;
    background: var(--off-white);
  }
  .form-field input:focus {
    border-color: var(--gold);
    background: #fff;
  }
  .btn-submit {
    width: 100%;
    background: var(--black);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 1rem;
  }
  .btn-submit:hover {
    background: var(--gold);
    color: var(--black);
    transform: translateY(-2px);
  }
  .back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    color: var(--black);
    transition: color 0.2s;
    display: flex;
    align-items: center;
  }
  .back-btn:hover { color: var(--gold); }
  .reg-legal {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1.5rem;
    line-height: 1.5;
  }
  .reg-legal a {
    color: var(--black);
    text-decoration: none;
    font-weight: 600;
  }
  .reg-legal a:hover { color: var(--gold); }
  
  .reg-login-link {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 14px;
  }
  .reg-login-link a {
    color: var(--gold);
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">
    <img src="image/rydemycar.png" alt="RydeMyCar" class="logo-img">
  </a>
</nav>

<main class="registration-wrapper">
  <div class="reg-card fade-in">
    <a href="index.html" class="back-btn"><i data-lucide="arrow-left"></i></a>
    <div class="reg-header">
      <h1 class="reg-title">Ryde<span>My</span>Car</h1>
      <p class="reg-subtitle">Create your account to get started</p>
    </div>

    <form action="#">
      <div class="role-toggle">
        <input type="radio" name="userRole" id="roleRenter" value="renter" checked>
        <label for="roleRenter">Renter</label>
        
        <input type="radio" name="userRole" id="roleHost" value="host">
        <label for="roleHost">Host</label>
      </div>

      <div class="form-field">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe" required>
      </div>

      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="john@example.com" required>
      </div>

      <div class="form-field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="+1 (555) 000-0000" required>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div class="reg-legal">
      By clicking "Create Account", you agree to our <br>
      <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>

    <p class="reg-login-link">
      Already have an account? <a href="login.html">Log In</a>
    </p>
  </div>
</main>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
</script>
</body>
</html>
