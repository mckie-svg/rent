<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - RydeMyCar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="image/rydemycar.png" type="image/x-icon">
<link rel="stylesheet" href="style.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .login-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .login-card {
    background: #fff;
    width: 100%;
    max-width: 440px;
    padding: 2.5rem;
    position: relative;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.05);
    border: 1px solid var(--warm-gray);
  }
  .login-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  .login-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    color: var(--black);
    letter-spacing: 1px;
    margin-bottom: 0.5rem;
  }
  .login-title span { color: var(--gold); }
  .login-subtitle {
    font-size: 14px;
    color: var(--text-muted);
  }
  .form-field { margin-bottom: 1.25rem; }
  .form-field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--black);
    margin-bottom: 6px;
  }
  .form-field input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--warm-gray);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s;
    outline: none;
    background: var(--off-white);
  }
  .form-field input:focus {
    border-color: var(--gold);
    background: #fff;
  }
  .btn-submit {
    width: 100%;
    background: var(--black);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 1rem;
  }
  .btn-submit:hover {
    background: var(--gold);
    color: var(--black);
    transform: translateY(-2px);
  }
  .back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    color: var(--black);
    transition: color 0.2s;
    display: flex;
    align-items: center;
  }
  .back-btn:hover { color: var(--gold); }
  .login-footer-link {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 14px;
  }
  .login-footer-link a {
    color: var(--gold);
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">
    <img src="image/rydemycar.png" alt="RydeMyCar" class="logo-img">
  </a>
</nav>
<main class="login-wrapper">
  <div class="login-card fade-in">
    <a href="index.html" class="back-btn"><i data-lucide="arrow-left"></i></a>
    <div class="login-header">
      <h1 class="login-title">Ryde<span>My</span>Car</h1>
      <p class="login-subtitle">Welcome back! Please enter your details.</p>
    </div>
    <form onsubmit="handleLogin(event)">
      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="john@example.com" required>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Log In</button>
    </form>
    <p class="login-footer-link">
      Don't have an account? <a href="registration.html">Sign Up</a>
    </p>
  </div>
</main>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();

  function handleLogin(event) {
    event.preventDefault(); // Prevent default form submission

    // In a real application, you would send credentials to a server for authentication.
    // For this demonstration, we'll simulate a successful login and redirect based on the stored role.

    const userRole = localStorage.getItem('userRole'); // Retrieve the stored role

    if (userRole === 'renter') {
      window.location.href = 'renter.html';
    } else if (userRole === 'host') {
      window.location.href = 'host.html';
    } else {
      // Default or error case if no role is found (e.g., user directly navigated to login without registering)
      alert('Login successful, but user role not found. Redirecting to Renter Dashboard by default.');
      window.location.href = 'renter.html'; // Default redirect
    }
  }
</script>
</body>
</html>
